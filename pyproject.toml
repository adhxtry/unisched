# pyproject.toml
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unisched"
version = "0.1.0"
description = "An exam scheduler application built with Python, designed to efficiently manage and optimize exam schedules at university level."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "pyside6>=6.7,<6.8",
]

[project.scripts]
unisched = "unisched.__main__:main"

[project.optional-dependencies]
deploy = ["nuitka", "zstandard"]  # deployment-only deps
dev = ["black", "pytest", "pytest-qt"]  # development-only deps

[tool.hatch.build.targets.wheel]
packages = ["src/unisched"]

[tool.black]
line-length = 100
target-version = ['py312']
skip-string-normalization = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra"
markers = []
